<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ônibus de Foz em 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Um mundo só (claro, como o mapa): cena 3D ocupando a tela, barra de botões à esquerda, faixa de modelos embaixo, janelas de informação à direita */
  --verde:#235b46; --verde2:#163e30; --ouro:#c5a15d; --creme:#eee5c8;
  --tinta:#1f2d33; --nevoa:#dfe5ea; --azul-btn:#1e3a5a;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--nevoa);color:var(--tinta);font-family:var(--body);-webkit-font-smoothing:antialiased}
#cena{position:fixed;inset:0;display:block;width:100%;height:100%;outline:none;touch-action:none}
button{font:inherit;color:inherit}
button:focus{outline:none}
button:focus-visible{outline:3px solid rgba(80,140,200,.65);outline-offset:2px;border-radius:14px}

/* ---------- barra de botões (dock) ---------- */
#dock{position:fixed;left:12px;top:12px;z-index:5;display:flex;flex-direction:column;gap:6px;padding:10px 6px;border-radius:28px;
  background:linear-gradient(#f4f7fa,#e4eaf1);box-shadow:0 1px 0 #fff inset,0 6px 16px rgba(30,40,55,.22),0 0 0 1px rgba(160,175,190,.45);max-height:calc(100% - 150px);overflow-y:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.db{appearance:none;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;width:62px}
.db .ico{position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--verde);
  background:radial-gradient(circle at 50% 32%,#fff 0%,#f3f6f9 58%,#d5dde6 100%);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.95),inset 0 -3px 5px rgba(120,135,155,.28),0 3px 6px rgba(40,50,70,.25);
  border:1px solid rgba(170,182,196,.65);transition:transform .12s ease,box-shadow .12s ease}
.db .ico:before{content:"";position:absolute;left:14%;right:14%;top:8%;height:42%;border-radius:50% 50% 45% 45%;background:linear-gradient(to bottom,rgba(255,255,255,.95),rgba(255,255,255,.05));pointer-events:none}
.db svg{width:26px;height:26px;position:relative;z-index:1}
.db .lb{font:800 10px/1.1 var(--body);color:var(--azul-btn);text-align:center;letter-spacing:.01em}
.db:hover .ico{transform:translateY(-1px)}
.db:active .ico{transform:translateY(1px)}
.db[aria-pressed="true"] .ico{color:#fff;background:radial-gradient(circle at 50% 30%,#3f8a6b 0%,var(--verde) 60%,var(--verde2) 100%);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.25),0 0 0 2px rgba(197,161,93,.55),0 3px 6px rgba(40,50,70,.2)}
.db[aria-pressed="true"] .ico:before{opacity:.35}
.db[aria-pressed="true"] .lb{color:#9a6b1c}

/* ---------- chip do topo ---------- */
#chip{position:fixed;top:10px;right:10px;z-index:5;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:12px;
  background:linear-gradient(180deg,rgba(248,249,251,.96) 0%,rgba(226,229,235,.96) 55%,rgba(210,214,221,.97) 100%);
  border:1px solid rgba(255,255,255,.55);box-shadow:0 4px 12px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.9);font:700 12.5px/1.25 var(--body);font-variant-numeric:tabular-nums;pointer-events:none}
#chip b{font-weight:800}
#chip .dot{width:22px;height:22px;border-radius:50%;background:var(--verde);display:grid;place-items:center;color:#fff}
#chip .dot svg{width:14px;height:14px}

/* ---------- seletor de conta: nosso modelo, FEPESE, FEPESE ajustado ---------- */
#cen{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:7;display:flex;gap:3px;padding:4px;border-radius:14px;
  background:linear-gradient(180deg,rgba(248,249,251,.97) 0%,rgba(226,229,235,.97) 55%,rgba(210,214,221,.98) 100%);
  border:1px solid rgba(255,255,255,.6);box-shadow:0 4px 12px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.9)}
#cen button{appearance:none;border:0;cursor:pointer;border-radius:10px;padding:8px 13px;background:none;font:800 13px/1 var(--body);color:var(--azul-btn);white-space:nowrap}
#cen button:hover{background:rgba(255,255,255,.7)}
#cen button[aria-pressed="true"]{color:#fff;background:linear-gradient(180deg,#3a7d62 0%,var(--verde) 60%,var(--verde2) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 3px rgba(0,40,20,.3)}
#cen button.fp[aria-pressed="true"]{background:linear-gradient(180deg,#5d7d96 0%,#3e5d78 60%,#2c465e 100%)}
#cen button.fa[aria-pressed="true"]{background:linear-gradient(180deg,#c9a463 0%,#a5803c 60%,#7f6128 100%)}
body.cen-fep #hud:before,body.cen-fep .jan .topo:before,body.cen-fep .dtopo:before{background:linear-gradient(90deg,#3e5d78 0 72%,var(--ouro) 72% 100%)}
body.cen-fepaj #hud:before,body.cen-fepaj .jan .topo:before,body.cen-fepaj .dtopo:before{background:linear-gradient(90deg,#a5803c 0 72%,#3e5d78 72% 100%)}
.selo{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:999px;font:800 10px/1.3 var(--body);letter-spacing:.04em;text-transform:uppercase;vertical-align:middle;background:#e4e9ee;color:#3e5d78}
.selo.aj{background:#f3e7cc;color:#7f6128}
.fpf{margin:2px 14px 8px;padding:8px 10px;border-radius:10px;background:#eef2f6;border-left:4px solid #3e5d78;font:600 11.5px/1.4 var(--body);color:#33454f}
.fpf.aj{background:#f7f0e0;border-left-color:#a5803c}
@media (max-width:1180px){#cen{left:96px;transform:none}}
@media (max-width:900px){#chip{top:58px}.jan{top:100px}}
@media (max-width:1000px){.mb .qf{display:none}}

/* ---------- faixa de baixo (modelos) ---------- */
#hud{position:fixed;left:12px;right:12px;bottom:10px;z-index:5;height:112px;border-radius:16px;display:flex;align-items:stretch;overflow:hidden;
  background:linear-gradient(180deg,rgba(248,249,251,.97) 0%,rgba(228,232,240,.97) 55%,rgba(212,218,228,.98) 100%);
  box-shadow:0 8px 20px rgba(0,0,0,.26),0 2px 4px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.55)}
#hud:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--verde) 0 72%,var(--ouro) 72% 100%)}
#hud .tab{flex:0 0 auto;width:178px;margin:14px 6px 10px 12px;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;padding:6px 10px;
  background:linear-gradient(180deg,#3a7d62 0%,var(--verde) 55%,var(--verde2) 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -2px 4px rgba(0,0,0,.25),0 2px 4px rgba(0,40,20,.3);border:1px solid rgba(255,255,255,.45)}
#hud .tab{appearance:none;cursor:pointer;font:inherit;transition:transform .12s ease}
#hud .tab:hover{transform:translateY(-1px)}
#hud .tab .t1{font:800 9.5px/1.15 var(--body);letter-spacing:.06em;text-transform:uppercase;opacity:.92}
#hud .tab .t2{font:800 21px/1.05 var(--display);margin:3px 0 2px;font-variant-numeric:tabular-nums}
#hud .tab .t3{font:700 10.5px/1.2 var(--body);font-variant-numeric:tabular-nums;opacity:.95}
#hud .tab h1{margin:0;font:800 20px/1 var(--display);letter-spacing:.01em;text-wrap:balance}
#hud .tab p{margin:5px 0 0;font:800 10px/1.2 var(--body);letter-spacing:.06em;text-transform:uppercase;opacity:.92}
#hud .vdiv{width:1px;margin:18px 8px;background:linear-gradient(180deg,transparent,rgba(22,62,48,.3) 20%,rgba(22,62,48,.3) 80%,transparent)}
#modelos{flex:1 1 auto;display:flex;align-items:center;justify-content:space-around;gap:6px;padding:12px 8px 8px;min-width:0}
.mb{flex:1 1 0;min-width:0;max-width:200px;appearance:none;border:0;background:none;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:14px}
.mb .ring{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;transition:transform .15s}
.mb .ring i{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 32%,#fff,#eef2f5 60%,#d7dee6);box-shadow:inset 0 -2px 4px rgba(110,125,145,.3)}
.mb .ring svg{width:38px;height:18px;color:var(--verde)}
.mb .nm{font:800 14px/1 var(--display);color:var(--tinta)}
.mb .sb{font:700 11px/1.15 var(--body);color:#4d5d66;font-variant-numeric:tabular-nums;white-space:nowrap}
.mb[aria-pressed="true"] .ring{transform:scale(1.07)}
.mb[aria-pressed="true"] .ring i{background:radial-gradient(circle at 50% 30%,#fffaf0,#f4ead0 60%,#e2d3a8)}
.mb[aria-pressed="true"] .nm{color:var(--verde)}
.mb:hover .ring{transform:translateY(-1px)}
#btnConta{flex:0 0 auto;align-self:center;margin:6px 14px 0 6px;appearance:none;cursor:pointer;border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:2px;
  border:1px solid rgba(255,255,255,.6);background:linear-gradient(180deg,#e9c987 0%,var(--ouro) 60%,#a9853f 100%);color:#3b2a0b;box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 2px 4px rgba(80,60,10,.3)}
#btnConta b{font:800 18px/1 var(--display);font-variant-numeric:tabular-nums}
#btnConta span{font:800 10px/1 var(--body);letter-spacing:.05em;text-transform:uppercase}

/* ---------- pontos clicáveis sobre o ônibus ---------- */
#pontos{position:fixed;inset:0;z-index:3;pointer-events:none}
.pt{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;pointer-events:auto;cursor:pointer;appearance:none;padding:0;border:2px solid #fff;
  background:radial-gradient(circle at 50% 35%,#4c9a7a,var(--verde) 70%);color:#fff;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.3);transition:opacity .2s}
.pt svg{width:18px;height:18px}
.pt:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(197,161,93,.85);animation:pulso 2.2s ease-out infinite;pointer-events:none}
.pt .tip{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;padding:3px 8px;border-radius:8px;background:rgba(31,45,51,.92);color:#fff;font:800 11px/1.2 var(--body);opacity:0;transition:opacity .15s;pointer-events:none}
.pt:hover .tip,.pt:focus-visible .tip{opacity:1}
.pt.longe{opacity:.35}
.pt.ativo{background:radial-gradient(circle at 50% 35%,#f0d396,var(--ouro) 70%);color:#3b2a0b}
@keyframes pulso{0%{transform:scale(.8);opacity:.9}80%,100%{transform:scale(1.5);opacity:0}}
body.sem-pontos #pontos{display:none}

/* ---------- janela de informação ---------- */
.jan{position:fixed;right:12px;top:58px;z-index:6;width:330px;max-height:calc(100% - 200px);overflow:auto;border-radius:16px;
  background:linear-gradient(180deg,rgba(252,252,250,.98),rgba(238,241,244,.98));border:1px solid rgba(255,255,255,.7);box-shadow:0 10px 28px rgba(0,0,0,.28),inset 0 1px 0 #fff}
.jan[hidden]{display:none}
.jan .topo{display:flex;align-items:center;gap:10px;padding:14px 14px 8px;position:relative}
.jan .topo:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:16px 16px 0 0;background:linear-gradient(90deg,var(--verde) 0 72%,var(--ouro) 72% 100%)}
.jan .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 50% 32%,#4c9a7a,var(--verde) 70%)}
.jan .ic svg{width:22px;height:22px}
.jan h2{margin:0;font:800 19px/1.05 var(--display);text-wrap:balance}
.jan .sub{font:700 11px/1.2 var(--body);color:#5b6a72;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
.jan .x{margin-left:auto;appearance:none;border:0;background:#e4e9ee;width:30px;height:30px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.jan .x svg{width:14px;height:14px}
.jan .grande{padding:2px 14px 6px;font:800 28px/1.1 var(--display);color:var(--verde);font-variant-numeric:tabular-nums}
.jan .grande small{font:700 13px var(--body);color:#5b6a72}
.jan ul{margin:0;padding:0 14px 6px 30px;font:600 13.5px/1.45 var(--body)}
.jan li{margin:3px 0}
.jan .fonte{padding:4px 14px 12px;font:600 11px/1.35 var(--body);color:#6c7a82}
.jan .acoes{display:flex;gap:8px;padding:0 14px 14px}
.jan .acoes button{appearance:none;cursor:pointer;border:1px solid rgba(22,62,48,.25);background:#fff;border-radius:10px;padding:7px 11px;font:800 12px/1 var(--body);color:var(--verde)}
.jan .acoes button.pri{background:var(--verde);color:#fff;border-color:var(--verde)}
.barra{display:flex;height:22px;border-radius:7px;overflow:hidden;margin:4px 14px 10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.barra span{display:block;height:100%}
.jan .cfr{margin:6px 14px 6px;padding:8px 10px;border:1px solid rgba(22,62,48,.18);border-radius:12px;background:rgba(255,255,255,.7)}
.jan .cft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;font:800 12.5px/1.2 var(--body);color:var(--verde)}
.jan .cft button{appearance:none;cursor:pointer;border:0;background:none;color:#46555d;text-decoration:underline;font:700 11.5px var(--body);padding:4px 0}
.jan .cfl{display:grid;grid-template-columns:1fr 32px 54px 32px;grid-template-rows:auto auto;align-items:center;column-gap:6px;padding:3px 0}
.jan .cfl span{font:800 13px/1.2 var(--body);color:#26343b}
.jan .cfl em{grid-column:1;grid-row:2;font:600 10.5px/1.2 var(--body);color:#6b7a82;font-style:normal}
.jan .cfl button{grid-row:1/3;appearance:none;cursor:pointer;width:32px;height:32px;border-radius:50%;border:1px solid rgba(22,62,48,.28);background:#fff;color:var(--verde);font:800 18px/1 var(--body)}
.jan .cfl button:active{background:#eef3f0}
.jan .cfl input{grid-row:1/3;width:54px;height:34px;box-sizing:border-box;text-align:center;border:2px solid var(--verde);border-radius:10px;background:#fff;font:800 16px/1 var(--display);color:var(--verde);font-variant-numeric:tabular-nums}
.jan .cfs{margin-top:6px;padding-top:6px;border-top:1px dashed rgba(22,62,48,.2);font:600 11.5px/1.35 var(--body);color:#46555d}
.jan .cl{display:block;padding:2px 14px 4px;font:700 12px/1.3 var(--body);color:#46555d}
.jan .cin{display:flex;align-items:center;gap:8px;margin:0 14px;padding:4px 12px;border:2px solid var(--verde);border-radius:12px;background:#fff}
.jan .cin input{flex:1;min-width:0;border:0;outline:0;background:none;font:800 24px/1.2 var(--display);color:var(--verde);font-variant-numeric:tabular-nums;padding:4px 0}
.jan .cin span{font:800 13px var(--body);color:#5b6a72}
.jan .csl{display:block;width:calc(100% - 28px);margin:10px 14px 4px;accent-color:var(--verde)}
.jan .cch{display:flex;flex-wrap:wrap;gap:6px;padding:4px 14px 8px}
.jan .cch button{appearance:none;cursor:pointer;border:1px solid rgba(22,62,48,.25);background:#fff;border-radius:999px;padding:5px 10px;font:800 11.5px/1 var(--body);color:var(--verde)}
.jan .cleg li{grid-template-columns:12px 1fr auto}
.jan .aviso{margin:4px 14px 6px;padding:8px 10px;border-radius:10px;background:#fff3e0;color:#7a4a00;font:700 12.5px/1.35 var(--body)}
.jan .cmini{margin:2px 14px 4px;font:600 12px/1.35 var(--body);color:#46555d}
.leg{list-style:none;margin:0;padding:0 14px 6px;display:grid;gap:5px;font:700 13px/1.25 var(--body);font-variant-numeric:tabular-nums}
.leg li{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}
.leg i{width:12px;height:12px;border-radius:3px}
.leg em{font-style:normal;color:#6c7a82;font-size:11.5px;min-width:34px;text-align:right}
.leg .tot{border-top:1px solid rgba(0,0,0,.1);padding-top:6px;margin-top:2px;font-weight:800}


/* ---------- janela grande: como chegamos a esse valor ---------- */
.det{position:fixed;inset:0;z-index:20;background:rgba(20,30,36,.45);display:grid;place-items:center;padding:16px}
.det[hidden]{display:none}
.dbox{width:min(940px,100%);max-height:calc(100% - 8px);overflow:auto;border-radius:18px;background:#fbfbf8;box-shadow:0 20px 50px rgba(0,0,0,.35);position:relative}
.dtopo{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:12px;padding:18px 18px 12px;background:linear-gradient(180deg,#fbfbf8 82%,rgba(251,251,248,0))}
.dtopo:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--verde) 0 72%,var(--ouro) 72% 100%)}
.det .ic{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 50% 32%,#4c9a7a,var(--verde) 70%)}
.det .ic svg{width:22px;height:22px}
.dtopo h2{margin:2px 0 0;font:800 22px/1.1 var(--display);text-wrap:balance}
.dtopo .sub{font:800 11px/1.2 var(--body);letter-spacing:.05em;text-transform:uppercase;color:#5b6a72}
.det .x{margin-left:auto;appearance:none;border:0;background:#e4e9ee;width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.det .x svg{width:15px;height:15px}
.dcorpo{padding:0 18px 20px}
.dcorpo .grande{font:800 28px/1.15 var(--display);color:var(--verde);margin:0 0 4px;font-variant-numeric:tabular-nums}
.dcorpo .grande small{font:700 14px var(--body);color:#5b6a72}
.ds{margin-top:18px}
.ds h3{margin:0 0 8px;font:800 16px/1.2 var(--display);color:var(--tinta);border-bottom:2px solid #e6dcc0;padding-bottom:4px;text-wrap:balance}
.ds p{margin:6px 0;font:600 13.5px/1.5 var(--body);max-width:78ch}
.fm{background:#f3eddd;border-left:4px solid var(--ouro);border-radius:8px;padding:10px 12px;font:800 14px/1.45 var(--body);color:#3a2f16}
.tw{overflow-x:auto;margin:4px 0}
.dt{width:100%;border-collapse:collapse;font:600 13px/1.35 var(--body);font-variant-numeric:tabular-nums}
.dt th{text-align:left;font:800 11px/1.2 var(--body);color:#5b6a72;text-transform:uppercase;letter-spacing:.03em;padding:6px 8px;border-bottom:1px solid #d9dccf;vertical-align:bottom}
.dt td{padding:6px 8px;border-bottom:1px solid #eceee6;vertical-align:top}
.dt td small{color:#6c7a82;font-weight:700}
.dt tr.dest td{background:#eaf3ec;font-weight:800}
.dt.pequena{font-size:12px}
.dl{margin:4px 0;padding-left:20px;font:600 13.5px/1.5 var(--body);max-width:80ch}
.dl li{margin:3px 0}
.df{margin:4px 0;padding-left:22px;font:600 12.5px/1.5 var(--body)}
.det a{color:#1d5e8f;text-underline-offset:2px}
.det details summary{cursor:pointer;font:800 13px var(--body);color:var(--verde);margin:8px 0}
.nota{font:600 11.5px/1.4 var(--body);color:#6c7a82;margin-top:18px}
@media (max-width:720px){.det{padding:0}.dbox{max-height:100%;height:100%;border-radius:0}.dcorpo{padding:0 12px 18px}.dtopo{padding:16px 12px 10px}}
/* noite: a interface escurece um pouco junto */
body.noite{background:#18212e}
body.noite #chip{color:var(--tinta)}

/* celular */
@media (max-width:720px){
  #dock{flex-direction:row;top:auto;bottom:118px;left:8px;right:8px;max-height:none;overflow-x:auto;overflow-y:hidden;padding:6px 8px;border-radius:22px;justify-content:flex-start}
  .db{width:56px;flex:none}
  .db .ico{width:42px;height:42px}
  .db svg{width:22px;height:22px}
  #hud{left:6px;right:6px;bottom:6px;height:104px}
  #hud .tab,#hud .vdiv{display:none}
  #modelos{padding:10px 2px 6px;gap:0}
  .mb .ring{width:50px;height:50px}.mb .ring i{width:42px;height:42px}
  .mb .sb{font-size:10px}
  .mb .qf{display:none}
  .mb .pk{display:none}
  .mb .nm{font-size:11.5px;letter-spacing:-.2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #btnConta span{font-size:8.5px;line-height:1.15;max-width:74px;white-space:normal;text-align:center}

function texturaTexto(txt, w, h, fundo, cor, fonte, brilho){

  if (brilho){ g.shadowColor = cor; g.shadowBlur = 10; }

  if (brilho){ g.shadowBlur = 0; g.fillStyle = 'rgba(0,0,0,.28)'; for (let y = 0; y < h; y += 4) g.fillRect(0, y, w, 1); for (let x = 0; x < w; x += 4) g.fillRect(x, 0, 1, h); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

function construir(id){
  const M = MOD[id], L = M.comp, H = M.alt, base = M.piso ? 0.3 : 0.38;
  const bus = new THREE.Group(); bus.userData = {rodas:[], portas:[], rampa:null, casca:[], vidros:[], farois:[], pontos:{}, luzes:[]};

  const mVidroF = mat('#2c4b53', {unico:true, r:.1, m:.3, op:.78});
  const mPilar = mat('#e3dabb', {unico:true, r:.5});
  const mOuro = mat(OURO, {unico:true, r:.4, m:.2});
  mVidro.userData.op0 = 0.82; mVidroF.userData.op0 = 0.78;
  U.casca.push(mCreme, mVerde, mTeto, mPilar, mOuro); U.vidros.push(mVidro, mVidroF);
  const add = (o, parte) => { if (parte) o.userData.parte = parte; bus.add(o); return o; };

  const secoes = M.artic ? [{x0:-1.9, x1:L/2, frente:true}, {x0:-L/2, x1:-2.9, tras:true}] : [{x0:-L/2, x1:L/2, frente:true, tras:true}];

    add(caixa(len - 0.1, 0.08, W + 0.035, mOuro, cx, base + 0.98, 0), 'onibus');           // faixa dourada

        add(caixa(0.1, 0.42, 0.22, mat('#334c46'), xf + 0.5, H - 0.92, lado*(W/2 + 0.36), 0.04));
      }

      const tp = texturaTexto('FOZ·0105', 256, 80, '#f7f7f2', '#1f2d33', '800 46px "Arial Black", sans-serif');
      const placa = new THREE.Mesh(new THREE.PlaneGeometry(0.52, 0.16), new THREE.MeshStandardMaterial({map:tp, roughness:.5}));
      placa.rotation.y = Math.PI/2; placa.position.set(xf + 0.14, base + 0.13, 0); bus.add(placa);

        add(caixa(0.05, 0.38, 0.18, mt, xt - 0.02, base + 0.95, lado*(W/2 - 0.16))); U.farois.push(mt);
      }
      add(caixa(0.16, 0.26, W + 0.04, mat('#234836'), xt - 0.03, base + 0.12, 0, 0.06));
      U.pontos.pecas = {p:[xt - 0.12, base + 0.62, 0], n:[-1, 0, 0], nome:'Motor e peças'};
    }
  }
  // sanfona do articulado
  if (M.artic){
    for (let i = 0; i < 9; i++){
      const x = -1.92 - i*0.11 - 0.06;
      add(caixa(0.07, H - base - 0.2 - (i%2)*0.08, W - 0.12 - (i%2)*0.1, mat(i%2 ? '#2c3332' : '#3d4645'), x, base + (H - base)/2 + 0.02, 0), 'onibus');
    }
    add(caixa(1.1, 0.1, 0.6, mat('#2c3332'), -2.4, base + 0.12, 0));
  }
  // ar-condicionado no teto
  const acx = M.artic ? 3.5 : L*0.12;
  add(caixa(2.4, 0.3, 1.7, mat('#d5d2bc', {r:.5}), acx, H + 0.2, 0, 0.1), 'ar');
  for (let x = acx - 0.9; x <= acx + 0.9; x += 0.18) add(caixa(0.05, 0.02, 1.2, mat('#8c9c91'), x, H + 0.36, 0), 'ar');
  if (M.artic) add(caixa(1.6, 0.26, 1.5, mat('#d5d2bc', {r:.5}), -5.6, H + 0.18, 0, 0.1), 'ar');
  U.pontos.ar = {p:[acx, H + 0.55, 0], n:[0, 1, 0], nome:'Ar-condicionado'};

  // rodas
  for (const ex of M.eixos){
    for (const lado of [-1, 1]){
      add(caixa(1.38, 0.72, 0.04, mat('#1a2323'), ex, base + 0.2, lado*(W/2 + 0.012)));
      const roda = new THREE.Group();
      const pneu = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.32, 28), mat('#222b2b', {r:.9}));
      pneu.rotation.x = Math.PI/2; pneu.castShadow = true; roda.add(pneu);
      const aro = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.34, 20), mat('#b4b9ad', {m:.5, r:.35}));
      aro.rotation.x = Math.PI/2; roda.add(aro);
      for (let k = 0; k < 6; k++){ const pz = caixa(0.05, 0.05, 0.36, mat('#59645e'), Math.cos(k*Math.PI/3)*0.19, Math.sin(k*Math.PI/3)*0.19, 0); roda.add(pz); }
      const cubo = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.38, 12), mat('#59645e'));
      cubo.rotation.x = Math.PI/2; roda.add(cubo);
      roda.position.set(ex, 0.5, lado*(W/2 - 0.1));
      roda.traverse(o => o.userData.parte = 'pneus');
      bus.add(roda); U.rodas.push(roda);
    }
  }
  U.pontos.pneus = {p:[M.eixos[0], 0.5, W/2 + 0.22], n:[0, 0, 1], nome:'Pneus'};

  // tanque de diesel (lado do motorista)
  const tx = (M.eixos[0] + M.eixos[1])/2 + (M.artic ? 1.8 : 0.9);
  add(caixa(1.0, 0.42, 0.08, mat('#3b4846', {m:.4, r:.4}), tx, base + 0.28, -(W/2 + 0.03), 0.03), 'diesel');
  const tampa = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.05, 16), mat('#c7c9bd', {m:.6, r:.3}));
  tampa.rotation.x = Math.PI/2; tampa.position.set(tx + 0.3, base + 0.35, -(W/2 + 0.08)); tampa.userData.parte = 'diesel'; bus.add(tampa);
  U.pontos.diesel = {p:[tx, base + 0.3, -(W/2 + 0.12)], n:[0, 0, -1], nome:'Diesel'};

  // portas (lado direito = +z)
  M.portas.forEach((px, i) => {
    add(caixa(1.24, H - base - 0.62, 0.02, mat('#16262a'), px, base + (H - base - 0.62)/2 + 0.04, W/2 + 0.012), 'portas');
    add(caixa(1.1, 0.06, 0.05, mat('#c9c2a7'), px, base + 0.06, W/2 + 0.02), 'portas');
    const folhas = [];
    for (const s of [-1, 1]){
      const f = new THREE.Group();
      f.add(caixa(0.6, H - base - 0.68, 0.05, mat('#192f31'), 0, 0, 0));
      for (const vy of [0.48, -0.42]) f.add(caixa(0.46, 0.78, 0.02, mat('#4d6e73', {r:.15, m:.2}), 0, vy, 0.03));
      f.add(caixa(0.04, 0.9, 0.04, mat('#d0c38f', {m:.5, r:.3}), -s*0.24, 0.05, 0.06));
      f.userData.s = s; f.userData.px = px;
      f.position.set(px + s*0.3, base + (H - base - 0.68)/2 + 0.06, W/2 + 0.04);
      f.traverse(o => o.userData.parte = 'portas');
      bus.add(f); folhas.push(f);
    }
    U.portas.push(...folhas);
    if (i === 1){
      const piv = new THREE.Group(); piv.position.set(px, base + 0.02, W/2 + 0.03);
      const r = caixa(0.95, 0.04, 0.9, mat('#b9b7a3', {r:.6}), 0, 0, 0.45); r.userData.parte = 'portas';
      piv.add(r); piv.visible = false; bus.add(piv); U.rampa = piv;
      U.pontos.portas = {p:[px, base + 1.35, W/2 + 0.1], n:[0, 0, 1], nome:'Portas e rampa'};
    }
  });

  // interior: piso, bancos, barras, motorista, validador, passageiros
  const piso = base + 0.32;
  add(caixa(L - 0.5, 0.05, W - 0.2, mat('#8c8a7a'), 0, piso, 0));
  const mBanco = mat('#2f6d8a', {r:.8}), mBancoB = mat('#285c75', {r:.8});
  const bancos = [];
  const frenteX = M.artic ? L/2 : L/2;
  for (let x = frenteX - 2.3; x > -L/2 + 0.9; x -= 0.85){
    if (M.artic && x < -1.6 && x > -3.2) continue;
    for (const z of [-0.86, -0.42, 0.42, 0.86]){
      if (z > 0 && M.portas.some(p => Math.abs(p - x) < 0.9)) continue;
      bus.add(caixa(0.42, 0.1, 0.4, mBanco, x, piso + 0.46, z));
      bus.add(caixa(0.07, 0.55, 0.4, mBancoB, x - 0.2, piso + 0.78, z));
      bancos.push([x, z]);
    }
  }
  const mBarra = mat('#e8c24a', {m:.5, r:.35});
  for (let x = frenteX - 1.6; x > -L/2 + 0.6; x -= 2.4){
    for (const z of [-0.3, 0.3]){ const b = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, H - piso - 0.5, 8), mBarra); b.position.set(x, piso + (H - piso - 0.5)/2, z); bus.add(b); }
  }
  for (const z of [-0.3, 0.3]){ const b = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, L - 1.2, 8), mBarra); b.rotation.z = Math.PI/2; b.position.set(0, H - 0.62, z); bus.add(b); }
  const mLuz = mat('#fff4d8', {unico:true, em:'#ffe3a8', ei:0});
  bus.add(caixa(L - 1.4, 0.03, 0.18, mLuz, 0, H - 0.5, 0)); U.luzes.push(mLuz); U.luzInterna = mLuz;
  // motorista
  const dx = frenteX - 1.0, dz = -(W/2 - 0.58);
  bus.add(caixa(0.5, 0.12, 0.5, mat('#3b4846'), dx - 0.1, piso + 0.5, dz));
  bus.add(caixa(0.08, 0.7, 0.5, mat('#3b4846'), dx - 0.34, piso + 0.9, dz));
  const corpo = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 0.36, 4, 10), mat('#3c6fa0', {r:.7}));
  corpo.position.set(dx - 0.12, piso + 0.95, dz); corpo.castShadow = true; corpo.userData.parte = 'motorista'; bus.add(corpo);
  const cab = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 12), mat('#d9a77c', {r:.7}));
  cab.position.set(dx - 0.08, piso + 1.45, dz); cab.userData.parte = 'motorista'; bus.add(cab);
  const bone = new THREE.Mesh(new THREE.SphereGeometry(0.155, 16, 8, 0, Math.PI*2, 0, Math.PI/2), mat(VERDE));
  bone.position.set(dx - 0.08, piso + 1.49, dz); bone.userData.parte = 'motorista'; bus.add(bone);
  const aba = caixa(0.14, 0.02, 0.22, mat(VERDE), dx + 0.08, piso + 1.5, dz); aba.userData.parte = 'motorista'; bus.add(aba);
  const volante = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.025, 8, 20), mat('#1d2a2b'));
  volante.position.set(dx + 0.32, piso + 1.05, dz); volante.rotation.y = Math.PI/2; volante.rotation.x = 0.0; volante.rotation.z = 0.6; volante.userData.parte = 'motorista'; bus.add(volante);
  U.pontos.motorista = {p:[dx, piso + 1.75, dz - 0.4], n:[0.2, 0.3, -1], nome:'Motorista'};
  // validador
  const vx = M.portas[0] - 0.95;
  bus.add(caixa(0.05, 1.0, 0.05, mBarra, vx, piso + 0.5, W/2 - 0.55));
  const val = caixa(0.16, 0.26, 0.14, mat('#2a6f9e', {r:.4}), vx, piso + 1.1, W/2 - 0.55, 0.02); val.userData.parte = 'bilhetagem'; bus.add(val);
  const tela = caixa(0.02, 0.1, 0.1, mat('#7fe0a2', {unico:true, em:'#58d38a', ei:.6}), vx + 0.09, piso + 1.15, W/2 - 0.55); tela.userData.parte = 'bilhetagem'; bus.add(tela);
  U.pontos.bilhetagem = {p:[vx, piso + 1.35, W/2 - 0.2], n:[0, 0.2, 1], nome:'Validador e GPS'};
  // passageiros sentados
  const roupas = ['#c25b4a','#e0a43c','#5a7fb5','#7b5aa6','#4f9a76','#d07aa0','#3f4b5a'], peles = ['#f1c9a5','#d9a77c','#a86f47','#7c4a2d'];
  let sem = id.length * 7;
  const rnd = () => { sem = (sem * 9301 + 49297) % 233280; return sem / 233280; };
  for (const [x, z] of bancos) {
    if (rnd() > 0.38) continue;
    const c = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.2, 4, 8), mat(roupas[Math.floor(rnd()*roupas.length)], {r:.8}));
    c.position.set(x - 0.04, piso + 0.78, z); bus.add(c);
    const h = new THREE.Mesh(new THREE.SphereGeometry(0.12, 12, 10), mat(peles[Math.floor(rnd()*peles.length)], {r:.7}));
    h.position.set(x, piso + 1.18, z); bus.add(h);
  }
  U.pontos.onibus = {p:[-L*0.22, H - 0.18, W/2 + 0.06], n:[0, 0.4, 1], nome:'Este ônibus'};

  // faróis de verdade (acendem à noite)
  for (const lado of [-1, 1]){
    const sp = new THREE.SpotLight('#ffefc2', 0, 26, 0.5, 0.55, 1.2);
    sp.position.set(L/2 + 0.1, base + 0.45, lado*(W/2 - 0.36));
    sp.target.position.set(L/2 + 10, 0, lado*0.8);
    bus.add(sp); bus.add(sp.target); U.luzes.push(sp);
    U.spots = (U.spots || []).concat(sp);
  }
  const pl = new THREE.PointLight('#ffd9a0', 0, 9, 1.5); pl.position.set(0, H - 0.8, 0); bus.add(pl); U.pontoLuz = pl;
  bus.userData.L = L; bus.userData.H = H;
  return bus;
}

/* ================= troca de modelo ================= */
let atual = 'leve', bus = null, entrada = 1;
function trocarModelo(id){
  if (bus){ scene.remove(bus); bus.traverse(o => { if (o.geometry) o.geometry.dispose(); }); letreiros.length = 0; }
  atual = id; bus = construir(id); scene.add(bus);
  entrada = 0; aplicarDentro(true); aplicarNoite(true);
  montarPontos();
  document.querySelectorAll('.mb').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
  document.getElementById('contaVal').textContent = brl(MOD[id].total);
  enquadrar(vistaAtual, false);
  if (!jan.hidden) abrir(janelaAtual || 'onibus');
  if (!detEl.hidden && detAtual) abrirDetalhe(detAtual);
}

/* ================= vistas da câmera ================= */
const VISTAS = ['Vista', 'De lado', 'De frente', 'De cima'];
let vistaAtual = 0, anim = null;
function enquadrar(v, suave = true){
  const L = MOD[atual].comp, d = 10 + L * 0.95;
  const alvo = new THREE.Vector3(0, 1.6, 0);
  const pos = [
    new THREE.Vector3(d*0.7, d*0.4, d*0.66),
    new THREE.Vector3(0.01, 2.6, d*1.02),
    new THREE.Vector3(d*0.95, 2.8, d*0.18),
    new THREE.Vector3(0.01, d*1.15, 0.6)
  ][v];
  if (!suave){ camera.position.copy(pos); controls.target.copy(alvo); return; }
  anim = {t:0, p0:camera.position.clone(), p1:pos, a0:controls.target.clone(), a1:alvo};
}

/* ================= pontos clicáveis ================= */
const pontosEl = document.getElementById('pontos');
let pontos = [];
function montarPontos(){
  pontosEl.innerHTML = ''; pontos = [];
  const ordem = ['motorista','diesel','pneus','pecas','ar','bilhetagem','onibus'];
  for (const k of ordem){
    const d = bus.userData.pontos[k]; if (!d) continue;
    const b = document.createElement('button');
    b.className = 'pt'; b.type = 'button'; b.innerHTML = IC[k] + `<span class="tip">${d.nome}</span>`;
    b.setAttribute('aria-label', d.nome);
    b.addEventListener('click', e => { e.stopPropagation(); clicarParte(k); });
    pontosEl.appendChild(b);
    pontos.push({k, el:b, p:new THREE.Vector3(...d.p), n:new THREE.Vector3(...d.n).normalize()});
  }
}
const tmp = new THREE.Vector3(), tmpN = new THREE.Vector3(), camDir = new THREE.Vector3();
function posicionarPontos(){
  const w = innerWidth, h = innerHeight;
  for (const pt of pontos){
    tmp.copy(pt.p); bus.localToWorld(tmp);
    tmpN.copy(pt.n).transformDirection(bus.matrixWorld);
    camDir.copy(camera.position).sub(tmp).normalize();
    const frente = tmpN.dot(camDir) > -0.05;
    tmp.project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    pt.el.style.display = vis ? '' : 'none';
    pt.el.style.transform = `translate(${(tmp.x*0.5 + 0.5)*w}px, ${(-tmp.y*0.5 + 0.5)*h}px)`;
    pt.el.classList.toggle('longe', !frente);
    pt.el.classList.toggle('ativo', pt.k === janelaAtual && !jan.hidden);
  }
}

}
function abrirCorte(){
  const cortes = ['300', '400', '450', '500'].map(c => [+c, NUM.cortes[c]]);
  const li = cortes.map(([c, v]) => `<li${c === 400 ? ' class="tot"' : ''}><i style="background:${c === 400 ? 'var(--ouro)' : '#cfd6dc'}"></i><span>Corte em ${c} mil km</span><b>${brl(v)}</b><em>${brl(NUM.P2)}</em></li>`).join('');
  jan.innerHTML = `<div class="topo"><span class="ic">${IC.onibus}</span><div><h2>Faixa de corte</h2><div class="sub">por mês · frota de ${NUM.frota}${seloCen()}</div></div>
    <button class="x" aria-label="Fechar">${IC.fechar}</button></div>
    <div class="grande">400 mil <small>km por mês</small></div>
    <ul>
      <li>Até 400 mil km: <b>${brl(NUM.P1)}</b> por km. Paga os custos fixos (${brl(NUM.F/1e6)} milhões por mês) mais o diesel, os pneus e as peças</li>
      <li>Acima de 400 mil km: <b>${brl(NUM.P2)}</b> por km, só o que aumenta com o km rodado</li>
      <li>Rodando 586 mil km, a conta dá ${brl(NUM.conta_mes/1e6)} milhões por mês, com qualquer corte</li>
      <li>Se o sistema rodar menos que o corte, a empresa não cobre os custos fixos</li>
      ${cenAtual === 'nosso' ? '' : '<li><b>A FEPESE não usa faixa de corte</b>: paga um valor só por km. Aqui está como ficaria em 2 faixas, com os números dela</li>'}
    </ul>
    <ul class="leg" style="margin-top:6px"><li style="font-size:11px;color:#6c7a82"><i></i><span>Outros cortes</span><b>até o corte</b><em>acima</em></li>${li}</ul>
    <div class="fonte">${cenAtual === 'nosso' ? 'Modelo do zero, média dos 105 ônibus, contrato de 12 anos.' : `Planilha da FEPESE${cenAtual === 'fepaj' ? ' ajustada' : ''}, média dos 120 ônibus, contrato de 20 anos.`}</div>`;
  jan.hidden = false; janelaAtual = 'corte';
}
document.getElementById('btnCorte').addEventListener('click', () => abrirDetalhe('geral'));
jan.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.classList.contains('x')){ jan.hidden = true; janelaAtual = null; tog(bt('bCalc'), false); return; }
  if (b.dataset.a === 'conta') abrirConta();
  if (b.dataset.a === 'det') abrirDetalhe(janelaAtual);
  if (b.dataset.a === 'geral') abrirDetalhe('geral');
  if (b.dataset.a === 'conf') abrirDetalhe('conf');
  if (b.dataset.km){ calcKm = +b.dataset.km; calcMostra(true); }
  if (b.dataset.fr){ calcFrotaMuda(b); }
  if (b.dataset.a === 'linha'){ trocarLinha(); abrir('letreiro'); }
  if (b.dataset.a === 'portas') alternarPortas();
});
function clicarParte(k){
  if (k === 'letreiro' && janelaAtual === 'letreiro' && !jan.hidden) trocarLinha();
  if (k === 'portas' && janelaAtual === 'portas' && !jan.hidden) alternarPortas();
  abrir(k);
}
document.getElementById('btnConta').addEventListener('click', abrirConta);

function detAr(M){
  const precos = {midi:[709889, 649342], leve:[768464, 700349], padron:[1201139, 1133024], articulado:[1946460, 1810231]};
  const [com, sem] = precos[atual], dif = com - sem;
  const {f, fat} = ANUIDADE(NUM.taxa, 12, 0);
  const parc = (dif - dif*0.1/f)*fat/12, capKm = parc*(FROTA_N/OPER_N)/(KM/OPER_N);
  const dieselAr = (M.consumo - M.consumo_sem_ar)*NUM.diesel;
  const frotaAr = (NUM.consumo_media - NUM.consumo_media_sem_ar)*NUM.diesel;
  return {t:'Ar-condicionado', g:`+ ${rs(capKm + dieselAr)} <small>por km no ${M.nome.toLowerCase()}</small>`, html:
    sec('A conta', `<div class="fm">Custo do ar = diesel a mais que o ar gasta + parte do preço do ônibus que é do ar</div><p>O ar não tem linha própria na planilha. Ele entra em dois lugares: no consumo de diesel e no preço do ônibus. A manutenção do ar entra nas peças, que são uma % do preço do ônibus com ar.</p>`) +

      [...linhas.map(([n, v]) => [n, rs0(v), pk(v)]), dest(['Total', rs0(C), f2(C/KM)])]) +
      `<p>O total foi achado no fluxo de caixa de 12 anos: é a receita que paga todos os custos, compra e troca os ônibus e dá à empresa 9,12% ao ano acima da inflação. ${fnt('planilha')}</p>`) +
    sec('2. O preço do km a mais (faixa 2)', tab(['Item', 'Conta', 'R$ por km'], [
      ['Diesel', `${n3(NUM.consumo_media)} l/km × ${rs(NUM.diesel)}`, n3(V.diesel)], ['Óleo, lubrificantes e Arla 32', 'edital de Foz', n3(V.oleo)],

      ['Soma', '', n3(V.soma)],
      dest(['Com o ISS de 3%', `${n3(V.soma)} ÷ 0,97`, rs(P2)])

      `<p>A parte fixa é o que sobra da conta do mês depois de tirar o km a mais: ${rs0(C)} − ${rs(P2)} × 586.000 = ${rs0(F)}.</p>`) +
    sec('4. O preço até o corte (faixa 1)', tab(['Etapa', 'Conta', 'Resultado'], [
      ['Parte fixa dividida pelos km do corte', `${rs0(F)} ÷ 400.000`, rs(F/X)],

      ['Conferência a 586 mil km', `400.000 × ${rs(p1)} + 186.000 × ${rs(P2)}`, rs0(X*p1 + 186000*P2)]

function efeitoFep(k){
  const i = FEP_PASSO[k]; if (!i) return '';
  const P = FEP.passos, d = P[i][1] - P[i - 1][1], s = d >= 0 ? '+' : '−';
  return `<p>Na planilha da FEPESE, a 586 mil km por mês, só esta troca muda a tarifa em <b>${s}${rs(Math.abs(d))} por km</b> (${s}${rs0(Math.abs(d)*NUM.km)} por mês).</p>`;
}
function detFepItem(k, c){
  const aj = cenAtual === 'fepaj';
  return {t:c.t, g:c.g, html:
    sec('O que a FEPESE pôs no papel', tab(['Item', 'Valor', 'De onde a FEPESE tirou'], c.papel)) +
    sec('O que está errado ou velho', lista(c.prob)) +
    sec(aj ? 'O que mudou no FEPESE ajustado' : 'Como fica no FEPESE ajustado', tab(c.ajCab || ['Item', 'FEPESE', 'Ajustado', 'Fonte do ajuste'], c.aj) + efeitoFep(k)) +
    (c.extra || '') + `<p>${fnt('errosFep')}</p>`};
}

/* ================= clique direto nas peças 3D ================= */
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let baixo = null;
canvas.addEventListener('pointerdown', e => { baixo = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!baixo || Math.hypot(e.clientX - baixo[0], e.clientY - baixo[1]) > 6) return;
  const parte = acharParte(e); if (parte) clicarParte(parte);
});
canvas.addEventListener('pointermove', e => { if (e.buttons) return; canvas.style.cursor = acharParte(e) ? 'pointer' : 'grab'; });
function acharParte(e){
  if (!bus) return null;
  mouse.set(e.clientX/innerWidth*2 - 1, -e.clientY/innerHeight*2 + 1);
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObject(bus, true);
  for (const h of hits){
    let o = h.object;
    while (o && !o.userData.parte && o !== bus) o = o.parent;
    if (o && o.userData.parte){
      if (o.userData.parte === 'letreiro' || o.userData.parte === 'portas') return 'onibus';
      if (estado.dentro > 0.5 && o.userData.parte === 'onibus') continue;
      return o.userData.parte;
    }
    if (estado.dentro < 0.5) return null;
  }
  return null;
}

/* ================= calculadora: km do mês e frota → conta do mês ================= */
let calcKm = NUM.km;
let FROTA_PADRAO = Object.fromEntries(ORDEM.map(k => [k, MOD[k].qtd]));
let calcFrota = {...FROTA_PADRAO};
const n0b = v => Math.round(v).toLocaleString('pt-BR');
/* Conta do sistema para qualquer frota e km. Parte da conta do modelo (105 ônibus, 586 mil km) e muda:
   ônibus (parcela, IR e seguro) pelo valor da frota; equipe de garagem, fiscais e validadores pelo nº de ônibus no pico;
   diesel, pneus e peças pela mistura de tipos; motoristas pelos km (horas rodadas). */
function custoSistema(fr, km){
  const T = NUM.tipos, FX = NUM.fixos, V = NUM.var, F0 = FROTA_PADRAO;
  const soma = (f, g) => ORDEM.reduce((s, k) => s + g(k)*f[k], 0);
  const N = ORDEM.reduce((s, k) => s + fr[k], 0), N0 = ORDEM.reduce((s, k) => s + F0[k], 0);
  if (!N) return null;
  const pico = N*NUM.oper/N0, esc = pico/NUM.oper;
  const parc = soma(fr, k => T[k].parcela)/soma(F0, k => T[k].parcela);
  const valor = soma(fr, k => T[k].preco), valor0 = soma(F0, k => T[k].preco);
  const fixos = {onibus: FX.capital*parc, ir: FX.ir*parc, seguros: FX.seguros*valor/valor0,
    equipe: (FX.manutencao + FX.fiscais + FX.limpeza + FX.adm + FX.mot_fixo)*esc, outros: FX.outros*esc, garagem: FX.garagem, rps: (FX.rps || 0)*esc};
  const F = Object.values(fixos).reduce((a, b) => a + b, 0)/(1 - NUM.iss);
  const cons = soma(fr, k => T[k].consumo)/N;
  const pneus = V.pneus*(soma(fr, k => MOD[k].pneusN)/N)/(soma(F0, k => MOD[k].pneusN)/N0);
  const pecas = V.pecas*(valor/N)/(valor0/N0);
  const P2 = (cons*NUM.diesel*(NUM.fkm || 1) + V.oleo + pneus + pecas + V.hora)*(1 + (NUM.rps_pct || 0))/(1 - NUM.iss);
  return {N, pico, F, P2, conta: F + P2*km, kmOnibus: km/N, valor, cons};
}
function abrirCalc(){
  const linhas = ORDEM.map(k => `<div class="cfl"><span>${MOD[k].nome}</span>
      <button data-fr="${k}" data-d="-1" aria-label="Menos ${MOD[k].nome}">−</button>
      <input id="fr_${k}" type="text" inputmode="numeric" autocomplete="off" value="${calcFrota[k]}" aria-label="Quantidade de ${MOD[k].nome}">
      <button data-fr="${k}" data-d="1" aria-label="Mais ${MOD[k].nome}">+</button>
      <em>${brl0(MOD[k].preco)}</em></div>`).join('');
  jan.innerHTML = `<div class="topo"><span class="ic">${IC.calc}</span><div><h2>Quanto custa o mês</h2><div class="sub">${cenAtual === 'nosso' ? `contrato de 12 anos · dados de ${NUM.data}` : 'contrato de 20 anos'}${seloCen()}</div></div>
    <button class="x" aria-label="Fechar">${IC.fechar}</button></div>
    <label class="cl" for="kmIn">Km rodados no mês, somando todos os ônibus</label>
    <div class="cin"><input id="kmIn" type="text" inputmode="numeric" autocomplete="off" value="${n0b(calcKm)}"><span>km</span></div>
    <input id="kmSl" class="csl" type="range" min="300000" max="800000" step="1000" value="${calcKm}" aria-label="Km por mês">
    <div class="cch">${[[400000, '400 mil'], [520000, '520 mil (com cortes)'], [586000, '586 mil (hoje)'], [650000, '650 mil']].map(([v, t]) => `<button data-km="${v}">${t}</button>`).join('')}</div>
    <div class="cfr"><div class="cft"><b>Ônibus de cada tipo</b><button data-fr="padrao">voltar aos ${NUM.frota}</button></div>${linhas}<div class="cfs" id="frTot"></div></div>
    <div id="calcOut" aria-live="polite"></div>`;
  jan.hidden = false; janelaAtual = 'calc'; tog(bt('bCalc'), true);
  const inp = document.getElementById('kmIn'), sl = document.getElementById('kmSl');
  inp.addEventListener('input', () => { const v = +inp.value.replace(/\D/g, ''); if (v > 0){ calcKm = Math.min(v, 3000000); sl.value = calcKm; calcMostra(false); } });
  inp.addEventListener('blur', () => { inp.value = n0b(calcKm); });
  sl.addEventListener('input', () => { calcKm = +sl.value; inp.value = n0b(calcKm); calcMostra(false); });
  for (const k of ORDEM){
    const el = document.getElementById('fr_' + k);
    el.addEventListener('input', () => { const v = el.value.replace(/\D/g, ''); calcFrota[k] = Math.min(+v || 0, 400); calcMostra(false); });
    el.addEventListener('blur', () => { el.value = calcFrota[k]; });
  }
  calcMostra(false);
}
function calcFrotaMuda(b){
  const k = b.dataset.fr;
  if (k === 'padrao') calcFrota = {...FROTA_PADRAO};
  else calcFrota[k] = Math.max(0, Math.min(400, calcFrota[k] + (+b.dataset.d)));
  for (const t of ORDEM){ const el = document.getElementById('fr_' + t); if (el) el.value = calcFrota[t]; }
  calcMostra(false);
}
function calcMostra(sync){
  const out = document.getElementById('calcOut'); if (!out) return;
  if (sync){ document.getElementById('kmIn').value = n0b(calcKm); document.getElementById('kmSl').value = calcKm; }
  const km = calcKm, X = 400000, c = custoSistema(calcFrota, km);
  const tot = document.getElementById('frTot');
  if (!c){ tot.textContent = 'Total: 0 ônibus'; out.innerHTML = '<div class="aviso">Ponha pelo menos um ônibus na frota.</div>'; return; }
  const padrao = ORDEM.every(k => calcFrota[k] === FROTA_PADRAO[k]);
  tot.innerHTML = `Total: <b>${n0b(c.N)} ônibus</b> · uns ${n0b(c.pico)} no pico · cada um roda ${n0b(c.kmOnibus)} km por mês`;
  const {F, P2, conta} = c, P1 = P2 + F/X;
  const faixas = Math.min(km, X)*P1 + Math.max(0, km - X)*P2;
  const hoje = Math.min(km, 500000)*9.97 + Math.max(0, km - 500000)*8.80;
  const base = custoSistema(FROTA_PADRAO, km);
  out.innerHTML = `<div class="grande">${brl0(conta)} <small>por mês</small></div>
    ${padrao ? '' : `<p class="cmini">Com a frota padrão (${NUM.frota} ônibus): ${brl0(base.conta)}. Diferença: <b>${conta >= base.conta ? '+' : '−'} ${brl0(Math.abs(conta - base.conta))} por mês</b> (${conta >= base.conta ? '+' : '−'} ${brl0(Math.abs(conta - base.conta)*12)} por ano).</p>`}
    <ul class="leg cleg">
      <li><i style="background:var(--verde)"></i><span>Por ano</span><b>${brl0(conta*12)}</b></li>
      <li><i style="background:var(--ouro)"></i><span>Média por km</span><b>${brl(conta/km)}</b></li>
      <li><i style="background:#3f7f9a"></i><span>Parte fixa (ônibus, equipe, garagem)</span><b>${brl0(F)}</b></li>
      <li><i style="background:#c5a15d"></i><span>${n0b(km)} km × ${brl(P2)}</span><b>${brl0(P2*km)}</b></li>
    </ul>
    ${c.kmOnibus > 8000 ? `<div class="aviso">Pouco ônibus para tanto km: cada um teria que rodar ${n0b(c.kmOnibus)} km por mês (hoje são uns 5.600). Na prática, faltaria ônibus no pico.</div>` : ''}
    ${c.kmOnibus < 4000 ? `<div class="aviso">Ônibus demais para esse km: cada um rodaria só ${n0b(c.kmOnibus)} km por mês, e muitos ficariam parados.</div>` : ''}
    ${km < X
      ? `<div class="aviso">Abaixo do corte de 400 mil km. Pela tarifa em 2 faixas, a empresa receberia ${brl0(faixas)} e faltariam ${brl0(conta - faixas)} da parte fixa.</div>`
      : `<p class="cmini">Pela tarifa em 2 faixas dá o mesmo: ${n0b(Math.min(km, X))} km × ${brl(P1)} + ${n0b(km - X)} km × ${brl(P2)}.</p>`}
    <div class="fonte">${cenAtual === 'nosso' ? 'Mudando a frota, mudam a parcela dos ônibus, o seguro, os impostos, as peças, o diesel, os pneus e a equipe de garagem e fiscalização. Os motoristas seguem os km rodados.' : 'Conta pela planilha da FEPESE: os motoristas seguem o número de ônibus rodando (3,834 por ônibus), não os km. Mudando a frota, mudam também a parcela dos ônibus, os impostos, o diesel, os pneus e as peças.'} A frota padrão é a ${cenAtual === 'nosso' ? 'do modelo' : 'da FEPESE'}: ${ORDEM.map(k => `${FROTA_PADRAO[k]} ${MOD[k].nome.toLowerCase()}`).join(', ')}.<br>
    Para comparar, o contrato de hoje (preços de mar/2025: R$ 9,97 até 500 mil km e R$ 8,80 acima) daria ${brl0(hoje)} por mês, com frota mais velha.</div>`;
}
bt('bCalc').onclick = () => { if (janelaAtual === 'calc' && !jan.hidden){ jan.hidden = true; janelaAtual = null; tog(bt('bCalc'), false); } else abrirCalc(); };
document.getElementById('chipMedia').textContent = `${brl(NUM.rkm)}/km`;
document.getElementById('corteT3').textContent = `até ${brl(NUM.P1)} · acima ${brl(NUM.P2)}`;

let audio = null;
bt('bBuzina').onclick = () => {
  estado.pula = 1;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime;
    for (const [ini, dur] of [[0, 0.22], [0.3, 0.42]]){
      const g = audio.createGain(); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, t0 + ini); g.gain.exponentialRampToValueAtTime(0.18, t0 + ini + 0.02);
      g.gain.setValueAtTime(0.18, t0 + ini + dur - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t0 + ini + dur);
      for (const fr of [311, 392]){ const o = audio.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; const lp = audio.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400; o.connect(lp); lp.connect(g); o.start(t0 + ini); o.stop(t0 + ini + dur + 0.02); }
    }
  } catch (err) { /* sem som neste navegador */ }
};

/* ================= noite e por dentro ================= */
function aplicarNoite(){
  const n = estado.noite;
  scene.background.copy(COR_DIA).lerp(COR_NOITE, n); scene.fog.color.copy(scene.background);
  hemi.intensity = 1.55 - 1.25*n; hemi.color.set('#ffffff').lerp(new THREE.Color('#8fa6d6'), n);
  sol.intensity = 2.3 - 2.05*n; sol.color.set('#fff3df').lerp(new THREE.Color('#9fb4e6'), n);
  for (const l of lampadas){ const m = l.janela ? l.material : l.material; m.emissiveIntensity = (l.janela ? 0.9 : 1.6) * n; }
  if (!bus) return;
  const U = bus.userData;
  for (const m of U.farois) m.emissiveIntensity = 0.15 + 1.6*n;
  U.luzInterna.emissiveIntensity = 1.4*n;
  for (const s of U.spots) s.intensity = 60*n;
  U.pontoLuz.intensity = 6*n;
  for (const l of letreiros) l.material.emissiveIntensity = 0.35 + 0.9*n;
}
function aplicarDentro(){
  if (!bus) return;
  const d = estado.dentro, U = bus.userData;
  for (const m of U.casca){ m.transparent = d > 0.01; m.opacity = 1 - 0.82*d; m.depthWrite = d < 0.5; m.needsUpdate = true; }
  for (const m of U.vidros){ m.opacity = m.userData.op0 * (1 - 0.8*d); m.depthWrite = d < 0.5; }
}

/* ================= laço de animação ================= */
const relogio = new THREE.Clock();
function easeBack(t){ const c = 1.5; return 1 + (c + 1)*Math.pow(t - 1, 3) + c*Math.pow(t - 1, 2); }
function quadro(){
  const dt = Math.min(relogio.getDelta(), 0.05), t = relogio.elapsedTime;
  // transições suaves
  const ir = (a, b, v) => a + (b - a) * Math.min(1, dt * v);
  estado.portas = ir(estado.portas, estado.portasAlvo, 3.2);
  const n0 = estado.noite; estado.noite = ir(estado.noite, estado.noiteAlvo, 3); if (Math.abs(n0 - estado.noite) > 1e-4) aplicarNoite();
  const d0 = estado.dentro; estado.dentro = ir(estado.dentro, estado.dentroAlvo, 4); if (Math.abs(d0 - estado.dentro) > 1e-4) aplicarDentro();
  estado.vel = ir(estado.vel, estado.velAlvo, 0.9);
  if (bus){
    const U = bus.userData;
    // entrada do modelo
    if (entrada < 1){ entrada = Math.min(1, entrada + dt*2.2); const s = reduz ? 1 : Math.max(0.001, easeBack(entrada)); bus.scale.set(s, s, s); }
    // portas: saem um pouco para fora e deslizam
    const p = estado.portas, sai = Math.min(1, p*2), desliza = Math.max(0, p*2 - 1);
    for (const f of U.portas){ f.position.z = W/2 + 0.04 + 0.13*sai; f.position.x = f.userData.px + f.userData.s*(0.3 + 0.52*desliza); }
    if (U.rampa){ U.rampa.visible = desliza > 0.02; U.rampa.rotation.x = -Math.PI/2 + (Math.PI/2 + 0.43)*desliza; }
    // rodas e balanço
    const ang = estado.vel * dt / 0.5;
    for (const r of U.rodas) r.rotation.z -= ang;
    const pula = estado.pula; estado.pula = Math.max(0, estado.pula - dt*2.5);
    bus.position.y = Math.sin(t*9)*0.012*Math.min(1, estado.vel/4) + Math.sin(pula*Math.PI*3)*0.05*pula;
    bus.rotation.z = Math.sin(t*1.7)*0.003*Math.min(1, estado.vel/4);
  }
  // cenário andando
  if (estado.vel > 0.01){
    for (const o of cenario){ o.position.x -= estado.vel*dt; if (o.position.x < -72) o.position.x += 140; }
    texRua.offset.x += estado.vel*dt/10;
  }
  // câmera
  if (anim){
    anim.t = Math.min(1, anim.t + dt*1.6); const k = anim.t < .5 ? 2*anim.t*anim.t : 1 - Math.pow(-2*anim.t + 2, 2)/2;
    camera.position.lerpVectors(anim.p0, anim.p1, k); controls.target.lerpVectors(anim.a0, anim.a1, k);
    if (anim.t >= 1) anim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  if (bus) posicionarPontos();
  requestAnimationFrame(quadro);
}
function redimensionar(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h;
  camera.fov = w < 720 ? 44 : 34;
  // desloca o desenho para o ônibus não ficar atrás da janela (direita) e da faixa de baixo
  if (w > 900) camera.setViewOffset(w, h, 120, 50, w, h); else camera.setViewOffset(w, h, 0, 95, w, h);
  camera.updateProjectionMatrix();
}
addEventListener('resize', redimensionar);
redimensionar();
try { await Promise.race([Promise.all([document.fonts.load('800 64px "Baloo 2"'), document.fonts.load('800 44px "Baloo 2"')]), new Promise(r => setTimeout(r, 1500))]); } catch (err) {}
trocarModelo('leve');
entrada = 1; bus.scale.set(1, 1, 1);
if (innerWidth > 900) abrir('onibus');
quadro();
